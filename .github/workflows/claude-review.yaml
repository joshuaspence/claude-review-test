---
name: 'Claude Review'

on:
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'ready_for_review'
      - 'reopened'

permissions: {}

jobs:
  review:
    uses: 'joshuaspence/claude-code-action/.github/workflows/claude-review.yaml@master'
    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
